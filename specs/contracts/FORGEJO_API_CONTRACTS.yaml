- id: FJ-ACT-004
  name: actions_run_logs
  module: actions
  purpose: Скачать и нормализовать логи всех jobs workflow run.
  exposure: provider_interface
  mutation: false
  upstream:
    method: GET
    path: /repos/{owner}/{repo}/actions/runs/{run_id}/logs
    operation_id: repoGetActionRunLogs
    response_type: binary_zip
  inputs:
    run_id:
      type: integer
