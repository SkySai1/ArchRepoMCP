  exposure: provider_interface
  mutation: true
  upstream:
    method: POST
    path: /repos/{owner}/{repo}/actions/workflows/{workflowfilename}/dispatches
    operation_id: DispatchWorkflow
    response_type: json
  inputs:
    workflow_file:
      type: repository_path
      required: true
      description: имя/путь workflow согласно Swagger целевого Forgejo
    ref:
      type: string
      required: true
    inputs:
      type: object<string, scalar>
      required: false
      default: {}
  output:
    accepted: boolean
    run: action_run|null
