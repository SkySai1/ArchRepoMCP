  - TIMEOUT
  - PROVIDER_ERROR
- id: FJ-PR-007
  name: pull_request_merge
  module: pull_requests
  purpose: Выполнить merge Pull Request только после явного разрешения пользователя и проверки ожидаемого head SHA.
  exposure: provider_interface
  mutation: true
  upstream:
    method: POST
    path: /repos/{owner}/{repo}/pulls/{index}/merge
    operation_id: repoMergePullRequest
    response_type: json
  inputs:
    index:
      type: integer
      required: true
      minimum: 1
    expected_head_sha:
      type: git_sha
      required: true
    strategy:
      type: enum:merge|rebase|rebase-merge|squash|fast-forward-only
      required: false
      default: merge
    delete_branch_after_merge:
      type: boolean
      required: false
      default: false
    merge_title:
      type: string
      required: false
    merge_message:
      type: string
      required: false
    explicit_user_authorization:
      type: boolean
      required: true
      const: true
  output:
    merged: 'constant: true'
    index: integer
    merge_commit_sha: string|null
  rules:
  - Функция запрещена без explicit_user_authorization=true, который должен быть получен из явного текущего запроса пользователя,
    а не выведен агентом.
  - Перед merge обязательно pull_request_get.
  - PR должен быть открыт.
  - Текущий head_sha должен точно совпадать с expected_head_sha; иначе CONFLICT.
  - Core обязан до вызова provider повторно выполнить DSL/repository validation.
  - force_merge всегда false и не может быть аргументом публичного contract.
  - merge_when_checks_succeed по умолчанию false и не используется для скрытого отложенного merge.
  - Branch protection и required status checks не обходить.
  - Mutation не повторяется вслепую.
  errors:
  - USER_AUTHORIZATION_REQUIRED
  - CONFLICT
  - NOT_FOUND
  - PROTECTED_BRANCH
  - CHECKS_NOT_PASSED
  - PERMISSION_DENIED
  - TIMEOUT
  - UNKNOWN_MUTATION_RESULT
  - PROVIDER_ERROR
