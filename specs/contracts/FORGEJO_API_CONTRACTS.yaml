  - Если target supports return_run_info, adapter может запросить run metadata; отсутствие этой возможности не меняет success
    semantics.
  - Mutation не повторяется вслепую.
  errors:
  - NOT_FOUND
  - VALIDATION_ERROR
  - PROVIDER_CAPABILITY_GAP
  - PERMISSION_DENIED
  - TIMEOUT
  - UNKNOWN_MUTATION_RESULT
  - PROVIDER_ERROR
contract_test_requirements:
  must_verify:
  - every function id is unique
  - every function name is unique within provider
  - all upstream method/path mappings exist in target instance Swagger or are reported as capability gaps
  - all required parameters are enforced
  - unknown public parameters are rejected
  - secrets never appear in logs/errors/responses
  - pagination is followed when a complete collection is requested
  - file content base64 conversion stays inside adapter
  - update/delete/move reject stale SHA
  - batch mutation stays single-commit
  - default/protected branch cannot be deleted
  - PR merge rejects stale head SHA
  - PR merge rejects missing explicit user authorization
  - mutation is not blindly retried after timeout
  - Forgejo 16 Actions endpoints are capability-checked against target Swagger
  integration_matrix:
  - minimum supported Forgejo 16.x patch chosen by project
  - latest available Forgejo 16.x patch
  recommended_fixture_flow:
  - provider_version
  - repository_get
