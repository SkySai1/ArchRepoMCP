  rules:
  - Endpoint добавлен в Forgejo 16; проверять target-instance Swagger.
  - Adapter распаковывает ZIP и возвращает UTF-8 plaintext logs.
  - Секреты, уже замаскированные Forgejo, не должны размаскировываться.
  - Ввести configurable max_log_bytes; превышение даёт RESPONSE_TOO_LARGE.
  - Если отдельный log не UTF-8, вернуть его как content_base64 только во внутренней provider model; MCP-facing слой не должен
