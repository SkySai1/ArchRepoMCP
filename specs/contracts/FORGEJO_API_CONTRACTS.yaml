- id: FJ-PR-006
  name: pull_request_is_merged
  module: pull_requests
  purpose: Проверить факт merge Pull Request.
  exposure: provider_interface
  mutation: false
  upstream:
    method: GET
    path: /repos/{owner}/{repo}/pulls/{index}/merge
    operation_id: repoPullRequestIsMerged
    response_type: json
  inputs:
    index:
      type: integer
      required: true
      minimum: 1
  output:
    merged: boolean
  rules:
  - Forgejo обычно выражает merged через HTTP success/no-content и not-merged через 404; adapter обязан нормализовать это
    в boolean.
  - 404 этого конкретного endpoint не должен автоматически означать, что сам PR отсутствует; при необходимости подтвердить
    pull_request_get.
  errors:
