declaration:
  kind: architecture_repository
  version: v2

entities:
  - name: network_fact
    relations:
      - regulatory_requirement
    files:
      path:
        match: regex
        value: '^systems/[^/]+/network-facts$'
      filename:
        match: regex
        value: '^NF-[0-9]+\.md$'
      format: markdown
      template: "templates/network-fact.md"

  - name: regulatory_requirement
    files:
      path:
        match: regex
        value: '^systems/[^/]+/regulatory-requirements$'
      filename:
        match: regex
        value: '^REQ-[0-9]+\.md$'
      format: markdown
      template: "templates/regulatory-requirement.md"
