declaration:
  kind: architecture_repository
  version: v2

entities:

  # ============================================================
  # FACTS
  # Факты о существующей или проектируемой архитектуре
  # ============================================================

  - name: fact
    description: >
      Факт о существующей или проектируемой архитектуре: компоненте, интерфейсе, технологии, настройке, характеристике или ином установленном свойстве системы.
    relations:
      - requirement
      - category
      - architecture_artifact

    files:
      path:
        match: exact
        value: "facts"

      filename:
        match: regex
        value: '^F-[0-9]{4}\.md$'

      format: markdown_front_matter

      template: "templates/fact.md"


  # ============================================================
  # REQUIREMENTS
  # Требования к архитектуре: ТЗ, НПА, внутренние требования
  # ============================================================

  - name: requirement
    description: >
      Требование к архитектуре: техническое задание, нормативный акт или внутреннее ограничение, которое система обязана выполнять.
    relations:
      - category
      - architecture_artifact

    files:
      path:
        match: exact
        value: "requirements"

      filename:
        match: regex
        value: '^R-[0-9]{4}\.md$'

      format: markdown_front_matter

      template: "templates/requirement.md"


  # ============================================================
  # ARCHITECTURE ARTIFACTS
  # Архитектурные документы, схемы и иные артефакты
  # ============================================================

  - name: architecture_artifact
    description: >
      Архитектурный документ, схема, модель или иной артефакт, описывающий устройство, поведение или решения системы.
    relations:
      - category

    files:
      path:
        match: exact
        value: "artifacts"

      filename:
        match: regex
        value: '^A-[0-9]{4}\.md$'

      format: markdown_front_matter

      template: "templates/artifact.md"


  # ============================================================
  # CATEGORIES
  # Классификация требований, фактов и артефактов
  # ============================================================

  - name: category
    description: >
      Категория для тематической классификации архитектурных фактов, требований и артефактов.
    files:
      path:
        match: exact
        value: "categories"

      filename:
        match: regex
        value: '^C-[0-9]{4}\.md$'

      format: markdown_front_matter

      template: "templates/category.md"
